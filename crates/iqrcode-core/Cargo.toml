[package]
name = "iqrcode-core"
description = "Core QR Code encoder: encoding, Reed-Solomon, matrix and trace."
keywords = ["qrcode", "qr", "no-std", "encoder", "barcode"]
categories = ["encoding", "no-std::no-alloc", "multimedia::images"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = []
trace = []
png = ["std", "dep:png"]

[dependencies]
png = { workspace = true, optional = true }

[dev-dependencies]
qrcodegen = { workspace = true }

[lints]
workspace = true
