[package]
name = "iqrcode"
description = "QR Code generator with CLI and optional PNG output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["cli"]
cli = []
png = ["iqrcode-core/png"]
full = ["cli", "png"]

[[bin]]
name = "iqrcode"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
iqrcode-core = { path = "../iqrcode-core", features = ["std"] }

[dev-dependencies]
rqrr = { workspace = true }

[lints]
workspace = true
