<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iqrcode-learn — construction d'un QR Code</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="title">iqrcode-learn</h1>
        <p data-i18n="subtitle">
          Construction pas à pas d'un QR Code, avec les explications de chaque étape.
        </p>
      </header>

      <section class="controls">
        <label>
          <span data-i18n="data">Données</span>
          <input id="data" type="text" value="HELLO WORLD" />
        </label>

        <label>
          <span data-i18n="level">Niveau</span>
          <select id="level">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="quartile">Quartile</option>
            <option value="high">High</option>
          </select>
        </label>

        <label>
          <span data-i18n="version">Version</span>
          <input id="version" type="number" min="1" max="40" placeholder="auto" />
        </label>

        <label>
          <span data-i18n="language">Langue</span>
          <select id="lang">
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
        </label>

        <button id="regenerate" data-i18n="regenerate">Régénérer</button>
      </section>

      <section class="player">
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
        </div>

        <aside class="lesson">
          <div id="meta" class="meta"></div>
          <h2 id="title"></h2>
          <p id="description"></p>
          <div id="mask" class="mask"></div>

          <div class="lesson-box">
            <h3 id="lesson-title" data-i18n="formula">Formule</h3>
            <pre id="lesson-formula"></pre>
          </div>
        </aside>
      </section>

      <section class="controls playback">
        <button id="prev">◀</button>
        <button id="play">Play</button>
        <button id="next">▶</button>
        <label>
          <span data-i18n="speed">Vitesse</span>
          <input id="speed" type="range" min="30" max="1000" value="220" />
        </label>
        <progress id="progress" value="0" max="1"></progress>
      </section>

      <details>
        <summary><span data-i18n="pipeline">Le pipeline avant la matrice</span></summary>
        <ul id="pipeline"></ul>
      </details>

      <p id="error" class="error"></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
