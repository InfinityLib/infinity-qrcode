<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iqrcode-learn — construction d'un QR Code</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>iqrcode-learn</h1>
        <p>Construction pas à pas d'un QR Code, avec les explications de chaque étape.</p>
      </header>

      <section class="controls">
        <label>
          Données
          <input id="data" type="text" value="HELLO WORLD" />
        </label>

        <label>
          Niveau
          <select id="level">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="quartile">Quartile</option>
            <option value="high">High</option>
          </select>
        </label>

        <label>
          Version
          <input id="version" type="number" min="1" max="40" placeholder="auto" />
        </label>

        <button id="regenerate">Régénérer</button>
      </section>

      <section class="player">
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
        </div>

        <aside class="lesson">
          <div id="meta" class="meta"></div>
          <h2 id="title"></h2>
          <p id="description"></p>
          <div id="mask" class="mask"></div>

          <div class="lesson-box">
            <h3 id="lesson-title"></h3>
            <p id="lesson-text"></p>
            <pre id="lesson-formula"></pre>
          </div>
        </aside>
      </section>

      <section class="controls playback">
        <button id="prev">◀</button>
        <button id="play">Play</button>
        <button id="next">▶</button>
        <label>
          Vitesse
          <input id="speed" type="range" min="30" max="1000" value="220" />
        </label>
        <progress id="progress" value="0" max="1"></progress>
      </section>

      <details>
        <summary>Le pipeline avant la matrice</summary>
        <ul id="pipeline"></ul>
      </details>

      <p id="error" class="error"></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
